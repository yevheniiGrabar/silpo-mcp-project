name: rozumnyi_koshyk_app
description: "Розумний кошик — тижневе меню + кошик Сільпо (economy/quality)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management (repository → notifier → UI)
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking to our Laravel BFF (never directly to mcp.silpo.ua)
  dio: ^5.7.0

  # Immutable DTOs
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Navigation + tab shell
  go_router: ^14.2.0

  # UI / animation / media
  flutter_animate: ^4.5.0
  flutter_secure_storage: ^9.2.2 # our Sanctum token only (NOT the Silpo token)
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1 # bundle locally for stable demo (see docs/04)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  # assets:
  #   - assets/fonts/   # declared in M1/design phase (docs/04)
